<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReserveStudio - Student Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>ReserveStudio</h1>
    <h2>Campus Studio & Equipment Booking</h2>
    
    <form id="login-form">
      <h3>Student Login</h3>
      <input type="email" id="email" placeholder="Student Email (@mugla.edu.tr)" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>

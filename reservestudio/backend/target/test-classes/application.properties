spring.datasource.url=jdbc:h2:mem:reservestudio;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Test şeması Mete'nin tablolarının birebir kopyasıdır (UNIQUE(slot_id) dahil)
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:test-schema.sql
spring.jpa.open-in-view=false

studio.open-hour=9
studio.close-hour=21
studio.booking-window-days=30
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*

spring.application.name=reservestudio-backend
server.port=8080

# --- MySQL: Mete'nin şeması (db/reservestudio_db.sql) ile aynı veritabanı ---
# Farklı ortamda ortam değişkeniyle değiştirilebilir: DB_URL, DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/reservestudio_db?serverTimezone=Europe/Istanbul&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Şemanın sahibi SQL dosyası: Hibernate tabloları oluşturmaz/değiştirmez.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.open-in-view=false

# Oturum (cookie tabanlı)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

# Stüdyo çalışma saatleri: saatlik slotlar 09:00 ... 20:00 başlangıçlı (21:00'de kapanır)
studio.open-hour=9
studio.close-hour=21
# Bugünden itibaren kaç gün ilerisi için rezervasyon/slot üretilsin
studio.booking-window-days=30

# Frontend ayrı bir sunucudan (Live Server 5500, python http.server 8000, vite 5173 ...) açılırsa
# bu adreslerden gelen isteklere izin verilir. Arayüz backend'den sunulurken (localhost:8080) CORS gerekmez.
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*

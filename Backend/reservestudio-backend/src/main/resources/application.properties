spring.application.name=reservestudio-backend
server.port=8080

# --- MySQL (ortam değişkenleriyle değiştirilebilir) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/reservestudio?createDatabaseIfNotExist=true&serverTimezone=Europe/Istanbul}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Şema kaynağı schema.sql (UNIQUE index'ler orada tanımlı). Hibernate şemaya dokunmaz.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.open-in-view=false

# Oturum
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

# Stüdyo çalışma saatleri (saatlik slotlar: 09:00 ... 20:00 başlangıçlı)
studio.open-hour=9
studio.close-hour=21

# Frontend adresleri (CORS)
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
